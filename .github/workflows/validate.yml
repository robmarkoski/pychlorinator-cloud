name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  metadata-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate metadata files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('custom_components/astralpool_halo_cloud/manifest.json').read_text())
          json.loads(Path('hacs.json').read_text())
          print('metadata_ok')
          PY

      - name: Compile integration (incl. vendored library)
        run: python -m compileall custom_components/astralpool_halo_cloud

      - name: Install unit test dependencies
        run: python -m pip install 'websockets>=12.0'

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
